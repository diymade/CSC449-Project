name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download JUnit and Hamcrest
      run: |
        mkdir lib
        curl -L -o lib/junit-4.13.2.jar https://search.maven.org/remotecontent?filepath=junit/junit/4.13.2/junit-4.13.2.jar
        curl -L -o lib/hamcrest-core-1.3.jar https://search.maven.org/remotecontent?filepath=org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

    - name: Compile Java files
      run: |
        mkdir classes
        javac -cp "lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" \
          -d classes $(find MovieReservation/src -name "*.java")

    - name: Run JUnit tests
      run: |
        java -cp "classes:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" \
          org.junit.runner.JUnitCore moviereservation.tests.ReservationJUnitTest
